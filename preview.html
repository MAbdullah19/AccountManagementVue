<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board preview</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" href="logo.png">
<script>
  try {
    var t = localStorage.getItem('account-board:theme');
    document.documentElement.dataset.theme =
      t === 'light' || t === 'dark' ? t
        : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  } catch (e) {
    document.documentElement.dataset.theme = 'light';
  }
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="shell">
  <div class="topbar">
    <div class="topbar-left">
      <div class="brand"><span class="brand-mark"></span><span class="brand-text">ACCOUNT BOARD</span></div>
      <nav class="nav"><a href="./activity.html">Activity →</a></nav>
    </div>
    <div class="topbar-right">
      <span class="who" data-admin="true">you@vuepulse.com · owner</span>
      <div class="conn" data-state="live"><span class="dot"></span><span>live</span></div>
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch theme">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.2 14.6A8.5 8.5 0 0 1 9.4 3.8a8.5 8.5 0 1 0 10.8 10.8Z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4.1"/>
          <path d="M12 2.7v2.1M12 19.2v2.1M4.4 4.4l1.5 1.5M18.1 18.1l1.5 1.5M2.7 12h2.1M19.2 12h2.1M4.4 19.6l1.5-1.5M18.1 5.9l1.5-1.5"/>
        </svg>
      </button>
    </div>
  </div>
  <header class="head">
    <h1>VuePulse</h1>
    <ul class="rules" aria-label="How this board works">
      <li>One person at a time</li>
      <li>Claim before you use</li>
      <li>Release when you are done</li>
    </ul>
  </header>

  <section class="summary" data-full="false" aria-label="Board summary">
    <p class="summary-figure">
      <span class="summary-count">2</span>
      <span class="summary-of">of 5 accounts free</span>
    </p>
    <div class="meter" aria-hidden="true">
      <div class="meter-seg" data-kind="free" style="width:40%"></div>
      <div class="meter-seg" data-kind="held" style="width:40%"></div>
      <div class="meter-seg" data-kind="overdue" style="width:20%"></div>
    </div>
    <ul class="legend" aria-hidden="true">
      <li data-kind="free"><span class="swatch"></span>Available <b>2</b></li>
      <li data-kind="held"><span class="swatch"></span>In use <b>2</b></li>
      <li data-kind="overdue"><span class="swatch"></span>Overdue <b>1</b></li>
    </ul>
  </section>

  <!-- Filled from index.html's own markup by the script below, so the panel
       cannot drift from the real one either. -->
  <div id="queue-slot"></div>

  <section class="board" id="board"></section>

  <!-- Lives on activity.html now; kept here so the log line has a fixture too. -->
  <header class="head" style="margin-top:44px">
    <h1>Recent activity</h1>
  </header>
  <ul class="log" id="log-list"></ul>
</main>

<script type="module">
// Pulls the real templates out of index.html so this preview cannot drift.
const html = await (await fetch('/index.html')).text();
const doc = new DOMParser().parseFromString(html, 'text/html');
const cardTpl = doc.getElementById('card-template');
const addTpl = doc.getElementById('add-template');
const rowTpl = doc.getElementById('queue-row-template');
const board = document.getElementById('board');

/* ------------------------------------------------------------ queue panel */

// The real panel, lifted whole out of index.html and then filled by hand.
const panel = doc.getElementById('queue-panel').cloneNode(true);
panel.hidden = false;
document.getElementById('queue-slot').append(panel);

const QUEUE = [
  { name: 'Hina M.', email: 'hina@vuepulse.com', turn: 'ops@vuepulse.com · 6:42 to claim' },
  { name: 'Omar T.', email: 'omar@vuepulse.com', wait: 'waiting 24m', mine: true },
  { name: 'Zara K.', email: '', wait: 'waiting 9m' },
];

panel.querySelector('#queue-count').textContent = ` (${QUEUE.length})`;
panel.querySelector('#queue-empty').hidden = true;
panel.querySelector('#queue-leave-btn').hidden = false;
panel.querySelector('#queue-join-btn').hidden = true;

QUEUE.forEach((entry, i) => {
  const li = rowTpl.content.firstElementChild.cloneNode(true);
  const els = {};
  for (const n of li.querySelectorAll('[data-el]')) els[n.dataset.el] = n;

  els.pos.textContent = String(i + 1);
  els.name.textContent = entry.name;
  els.email.textContent = entry.email;
  els.email.hidden = !entry.email;
  els.turn.hidden = !entry.turn;
  els.turn.textContent = entry.turn || '';
  els.wait.hidden = Boolean(entry.turn);
  els.wait.textContent = entry.wait || '';
  els.remove.hidden = !entry.mine;

  li.dataset.mine = String(Boolean(entry.mine));
  li.dataset.turn = String(Boolean(entry.turn));
  panel.querySelector('#queue-list').append(li);
});

/* ----------------------------------------------------------------- cards */

const ACCOUNTS = [
  { label: 'users@vuepulse.com', desc: 'Main shared login', state: 'free' },
  { label: 'billing@vuepulse.com', desc: 'Stripe dashboard', state: 'held',
    holder: 'Muhammad Abdullah', meta: 'Since 2:14 PM · 32m 07s elapsed · est. free by 3:00 PM',
    elapsed: 68, note: 'running the monthly export',
    nudge: '3 people are in the queue — please release when you can.' },
  { label: 'ops@vuepulse.com', desc: 'Reserved for whoever is next in line',
    state: 'free', badge: 'Reserved',
    reserved: { word: 'Reserved for Hina M. — 6:42 left', sub: 'hina@vuepulse.com' } },
  { label: 'analytics@vuepulse.com', desc: 'GA4 + Looker', state: 'free',
    badge: 'Your turn', mine: true,
    reserved: {
      word: 'Your turn — 4:08 left',
      sub: 'Claim it now. If the time runs out it goes to the next person and you lose your place in the queue.',
    } },
  { label: 'support@vuepulse.com', desc: '', state: 'overdue', holder: 'Bilal R.',
    meta: 'Since 9:02 AM · held 4h 51m, still in use?', word: 'Overdue', release: true,
    elapsed: 100,
    alert: 'You have had this for 4h 51m. Please finish up and release it.',
    nudge: '3 people are in the queue — please release when you can.' },
];

for (const a of ACCOUNTS) {
  const root = cardTpl.content.firstElementChild.cloneNode(true);
  const els = {};
  for (const n of root.querySelectorAll('[data-el]')) els[n.dataset.el] = n;

  root.dataset.state = a.state;
  if (a.reserved) root.dataset.reserved = a.mine ? 'mine' : 'other';

  els.label.textContent = a.label;
  els.description.textContent = a.desc;
  els.description.hidden = !a.desc;

  els['card-badge'].hidden = !a.badge;
  els['card-badge'].textContent = a.badge || '';

  const held = a.state !== 'free';
  els['view-free'].hidden = held;
  els['view-held'].hidden = !held;

  if (held) {
    els['held-word'].textContent = a.word || 'In use';
    els.holder.textContent = a.holder;
    els['held-meta'].textContent = a.meta;
    els['held-note'].textContent = a.note || '';
    els['held-note'].hidden = !a.note;
    els['release-btn'].hidden = !a.release;
    els.timebar.hidden = typeof a.elapsed !== 'number';
    els['timebar-fill'].style.width = `${a.elapsed || 0}%`;

    els['session-alert'].hidden = !a.alert;
    els['session-alert'].textContent = a.alert || '';
    els['queue-alert'].hidden = !a.nudge;
    els['queue-alert'].textContent = a.nudge || '';
    els['card-alerts'].hidden = !a.alert && !a.nudge;
  } else {
    els.reserved.hidden = !a.reserved;
    els['free-sub'].hidden = Boolean(a.reserved);
    // Reserved for somebody else means the form is not there to click — the
    // one state where a free card offers nothing.
    els['claim-form'].hidden = Boolean(a.reserved) && !a.mine;
    if (a.reserved) {
      els['reserved-word'].textContent = a.reserved.word;
      els['reserved-sub'].textContent = a.reserved.sub;
    }
    els.name.value = 'Muhammad Abdullah';
  }

  els.admin.hidden = false;
  board.append(root);
}

board.append(addTpl.content.firstElementChild.cloneNode(true));

const LOG = [
  ['2:14 PM', 'claimed', 'Muhammad Abdullah claimed billing@vuepulse.com'],
  ['1:58 PM', 'released', 'Muhammad Abdullah released users@vuepulse.com'],
  ['1:02 PM', 'force-released', 'Bilal R. force-released ops@vuepulse.com (held by Muhammad Abdullah): “left for the day”'],
  ['12:55 PM', 'joined-queue', 'Hina M. (hina@vuepulse.com) joined the queue'],
  ['12:40 PM', 'queue-timeout', 'Zara K. did not claim ops@vuepulse.com in time and left the queue'],
  ['Jul 30, 1:06 PM', 'released', 'Setup B released the account'],
];
for (const [time, action, text] of LOG) {
  const li = document.createElement('li');
  li.dataset.action = action;
  const t = document.createElement('span');
  t.className = 'log-time';
  t.textContent = time;
  const b = document.createElement('span');
  b.className = 'log-text';
  b.textContent = text;
  li.append(t, b);
  document.getElementById('log-list').append(li);
}

// The toggle is real here too, so the preview is the thing you check both
// themes in rather than a light-only copy of the board.
const { initTheme } = await import('./theme.js');
const { initCardFx } = await import('./cardfx.js');
initTheme();
initCardFx();
</script>
</body>
</html>
