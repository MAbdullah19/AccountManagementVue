<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VuePulse Account Board</title>
<meta name="color-scheme" content="light dark">
<!-- The real mark, so the tab is recognisable at a glance in a pinned window.
     One file rather than the old inline square, which is why logo.png is the
     single .png the repo does not ignore. -->
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<!-- The theme has to be on <html> before anything paints, or a dark-theme
     reader gets a white flash on every load. Inline and blocking on purpose;
     theme.js owns everything after this and shares the key. -->
<script>
  try {
    var t = localStorage.getItem('account-board:theme');
    document.documentElement.dataset.theme =
      t === 'light' || t === 'dark' ? t
        : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  } catch (e) {
    document.documentElement.dataset.theme = 'light';
  }
</script>
<!-- Critical styles: layout skeleton only, so the board never flashes unstyled. -->
<style>
  :root { --w: 1080px; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fff;
    color: #1a1a1a;
  }
  :root[data-theme="dark"] body { background: #0e0e0f; color: #f4f4f5; }
  .shell { max-width: var(--w); margin: 0 auto; padding: 28px 20px 56px; }
  .card { border: 1px solid #e4e4e7; border-radius: 18px; padding: 22px; }
  /* grid.js appends a canvas sized in device pixels. Unstyled that is an inline
     box two thousand pixels tall at the top of the body, so this one rule is
     not decoration — it is what stops the page folding if styles.css is slow. */
  .grid-bg { position: fixed; inset: 0; z-index: -2; width: 100%; height: 100%; pointer-events: none; }
  [hidden] { display: none !important; }
</style>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="shell">

  <div class="topbar">
    <div class="topbar-left">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">ACCOUNT BOARD</span>
      </div>
      <!-- Shown to the owner only, by app.js. The log is theirs, and the
           original reason for leaving it unlinked — one fewer thing for
           everyone else to bounce off — is kept by never rendering it for
           anyone else, rather than by hiding it from the person it is for. -->
      <nav class="nav" id="nav" hidden><a href="./activity.html">Activity</a></nav>
    </div>
    <div class="topbar-right">
      <!-- Only rendered once Cloudflare Access has named the reader. -->
      <span class="who" id="who" hidden></span>
      <div class="conn" id="conn" data-state="connecting" title="Connection to the board">
        <span class="dot" aria-hidden="true"></span>
        <span class="conn-label" id="conn-label">connecting…</span>
      </div>
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch theme">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.2 14.6A8.5 8.5 0 0 1 9.4 3.8a8.5 8.5 0 1 0 10.8 10.8Z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4.1"/>
          <path d="M12 2.7v2.1M12 19.2v2.1M4.4 4.4l1.5 1.5M18.1 18.1l1.5 1.5M2.7 12h2.1M19.2 12h2.1M4.4 19.6l1.5-1.5M18.1 5.9l1.5-1.5"/>
        </svg>
      </button>
    </div>
  </div>

  <header class="head">
    <h1>VuePulse</h1>
    <p class="sub">One person at a time on each account. Claim it before you use
      it, release it when you are done.</p>
  </header>

  <!-- The board answers "is this one free?". This answers "is anything free?",
       which is the question people arrive with. Shown by app.js only once there
       are enough accounts for the cards to stop being their own summary. -->
  <section class="summary" id="summary" hidden aria-label="Board summary">
    <p class="summary-figure">
      <span class="summary-count" id="summary-count">0</span>
      <span class="summary-of" id="summary-of"></span>
    </p>
    <div class="meter" id="meter" aria-hidden="true">
      <div class="meter-seg" data-kind="free"></div>
      <div class="meter-seg" data-kind="held"></div>
      <div class="meter-seg" data-kind="overdue"></div>
    </div>
    <ul class="legend" id="legend" aria-hidden="true">
      <li data-kind="free"><span class="swatch"></span>Available <b id="legend-free">0</b></li>
      <li data-kind="held"><span class="swatch"></span>In use <b id="legend-held">0</b></li>
      <li data-kind="overdue" id="legend-overdue-item" hidden><span class="swatch"></span>Overdue <b id="legend-overdue">0</b></li>
    </ul>
  </section>

  <!-- Shown only when setup is incomplete or sign-in fails. -->
  <div class="banner" id="banner" hidden role="alert">
    <strong id="banner-title">Setup incomplete</strong>
    <p id="banner-body"></p>
  </div>

  <!-- One card per account, plus the owner's add-account card at the end. -->
  <section class="board" id="board" aria-live="polite" aria-label="Accounts"></section>

  <p class="board-empty" id="board-empty" hidden></p>

</main>

<!-- Cloned once per account. Elements are found by data-el rather than by id,
     because there are now many cards and ids have to stay unique. -->
<template id="card-template">
  <article class="card" data-state="loading">

    <header class="card-head">
      <h2 class="card-label" data-el="label"></h2>
      <p class="card-desc" data-el="description" hidden></p>
    </header>

    <!-- free -->
    <div class="view" data-el="view-free" hidden>
      <p class="state-word state-big">Available</p>
      <p class="state-sub">Nobody is holding this right now.</p>

      <form class="claim-form" data-el="claim-form" novalidate>
        <label class="field">
          <span class="label">Your name</span>
          <input data-el="name" type="text" maxlength="40" autocomplete="name"
                 placeholder="e.g. Muhammad Abdullah" required>
        </label>

        <!-- Optional: an empty duration means "the usual", which app.js reads
             as 30 minutes. In sight rather than behind a disclosure, because
             there is only one field left to show. -->
        <label class="field field-short">
          <span class="label">Minutes <span class="muted">(optional)</span></span>
          <input data-el="minutes" type="number" min="1" max="480" step="1"
                 inputmode="numeric" placeholder="30">
        </label>

        <button class="btn btn-primary" data-el="claim-btn" type="submit">Claim</button>
      </form>

      <p class="msg" data-el="claim-msg" role="status"></p>
    </div>

    <!-- held / overdue -->
    <div class="view" data-el="view-held" hidden>
      <p class="state-word" data-el="held-word">In use</p>
      <p class="holder" data-el="holder"></p>
      <p class="state-sub" data-el="held-meta"></p>

      <!-- The same numbers held-meta spells out, as a shape you can read from
           across the room. aria-hidden because it repeats the sentence above
           it and adds nothing for a screen reader. -->
      <div class="timebar" data-el="timebar" hidden aria-hidden="true">
        <div class="timebar-fill" data-el="timebar-fill"></div>
      </div>

      <p class="held-note" data-el="held-note" hidden></p>

      <div class="actions">
        <button class="btn btn-primary" data-el="release-btn" type="button" hidden>Release</button>

        <form class="force-form" data-el="force-form" novalidate>
          <label class="field" data-el="force-who-field" hidden>
            <span class="label">Your name</span>
            <input data-el="force-who" type="text" maxlength="40"
                   placeholder="e.g. Muhammad Abdullah" autocomplete="name">
          </label>
          <label class="field">
            <span class="label">Force release <span class="muted">(reason required)</span></span>
            <input data-el="force-reason" type="text" maxlength="120"
                   placeholder="e.g. Abdullah left for the day">
          </label>
          <button class="btn btn-quiet" data-el="force-btn" type="submit" disabled>Force release</button>
          <p class="force-as muted" data-el="force-as" hidden></p>
        </form>
      </div>

      <p class="msg" data-el="held-msg" role="status"></p>
    </div>

    <!-- Who the account is for. Reference, not permission — everyone sees it,
         only the owner edits it. -->
    <div class="roster" data-el="roster" hidden>
      <h3 class="roster-head">Who this is for</h3>
      <ul class="roster-list" data-el="roster-list"></ul>

      <details class="more" data-el="roster-more" hidden>
        <summary>Add a person</summary>
        <form data-el="roster-form" novalidate>
          <label class="field">
            <span class="label">Name</span>
            <input data-el="roster-name" type="text" maxlength="40" placeholder="e.g. Muhammad Abdullah">
          </label>
          <label class="field">
            <span class="label">Note <span class="muted">(optional)</span></span>
            <input data-el="roster-note" type="text" maxlength="60" placeholder="e.g. Finance">
          </label>
          <button class="btn btn-quiet btn-sm" data-el="roster-add" type="submit">Add</button>
        </form>
      </details>

      <p class="msg" data-el="roster-msg" role="status"></p>
    </div>

    <!-- owner controls; never rendered for anyone else -->
    <div class="card-admin" data-el="admin" hidden>
      <div class="admin-links" data-el="admin-links">
        <button class="link-btn" data-el="rename-btn" type="button">Rename</button>
        <button class="link-btn link-danger" data-el="delete-btn" type="button">Delete</button>
      </div>

      <form class="admin-form" data-el="rename-form" hidden novalidate>
        <label class="field">
          <span class="label">Account name</span>
          <input data-el="rename-label" type="text" maxlength="60" required>
        </label>
        <label class="field">
          <span class="label">Description <span class="muted">(optional)</span></span>
          <input data-el="rename-desc" type="text" maxlength="120">
        </label>
        <div class="admin-buttons">
          <button class="btn btn-primary btn-sm" data-el="rename-save" type="submit">Save</button>
          <button class="btn btn-quiet btn-sm" data-el="rename-cancel" type="button">Cancel</button>
        </div>
      </form>

      <div class="admin-confirm" data-el="delete-confirm" hidden>
        <p class="admin-warn" data-el="delete-warn"></p>
        <div class="admin-buttons">
          <button class="btn btn-danger btn-sm" data-el="delete-yes" type="button">Delete account</button>
          <button class="btn btn-quiet btn-sm" data-el="delete-no" type="button">Cancel</button>
        </div>
      </div>

      <p class="msg" data-el="admin-msg" role="status"></p>
    </div>

  </article>
</template>

<!-- The owner's add-account card, appended after the account cards. -->
<template id="add-template">
  <form class="card card-add" novalidate>
    <h2 class="card-label">Add an account</h2>
    <label class="field">
      <span class="label">Account name</span>
      <input data-el="add-label" type="text" maxlength="60"
             placeholder="e.g. billing@vuepulse.com" required>
    </label>
    <label class="field">
      <span class="label">Description <span class="muted">(optional)</span></span>
      <input data-el="add-desc" type="text" maxlength="120"
             placeholder="e.g. Stripe dashboard">
    </label>
    <button class="btn btn-primary" data-el="add-btn" type="submit">Add account</button>
    <p class="msg" data-el="add-msg" role="status"></p>
  </form>
</template>

<!-- What the board looks like before the first snapshot lands. A card-shaped
     ghost says "this is loading"; the line of grey text it replaces said
     "there is nothing here", which is the opposite. -->
<template id="skeleton-template">
  <div class="skel" aria-hidden="true">
    <div class="skel-line w-60"></div>
    <div class="skel-line w-40"></div>
    <div class="skel-line tall w-80"></div>
    <div class="skel-line block"></div>
  </div>
</template>

<script type="module" src="app.js"></script>
</body>
</html>
