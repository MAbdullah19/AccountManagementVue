<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity · VuePulse</title>
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='16'%20height='16'%20rx='5'%20fill='%23e01e37'/%3E%3C/svg%3E">
<!-- Critical styles: layout skeleton only, so the page never flashes unstyled. -->
<style>
  :root { --w: 1080px; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fff;
    color: #0d0e11;
  }
  .shell { max-width: var(--w); margin: 0 auto; padding: 28px 20px 56px; }
  [hidden] { display: none !important; }
</style>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="shell">

  <div class="topbar">
    <div class="topbar-left">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">ACCOUNT BOARD</span>
      </div>
      <nav class="nav"><a href="./index.html">Board</a></nav>
    </div>
    <div class="topbar-right">
      <span class="who" id="who" hidden></span>
      <div class="conn" id="conn" data-state="connecting" title="Connection to the board">
        <span class="dot" aria-hidden="true"></span>
        <span class="conn-label" id="conn-label">connecting…</span>
      </div>
    </div>
  </div>

  <header class="head">
    <h1>Recent activity</h1>
    <p class="sub">Every claim, release and force release, newest first. The log
      is append-only, so nothing here can be edited or taken back.</p>
  </header>

  <div class="banner" id="banner" hidden role="alert">
    <strong id="banner-title">Setup incomplete</strong>
    <p id="banner-body"></p>
  </div>

  <ul class="log" id="log-list" aria-live="polite">
    <li class="log-empty">Loading…</li>
  </ul>

  <p class="log-foot" id="log-foot" hidden></p>

</main>

<script type="module" src="activity.js"></script>
</body>
</html>
