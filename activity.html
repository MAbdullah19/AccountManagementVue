<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity · VuePulse Account Board</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<!-- Kept byte-identical to the block in index.html: it has to run before the
     stylesheet on both pages, so it cannot be a module, and a module is the
     only way it could have been shared. theme.js owns everything after it. -->
<script>
  try {
    var t = localStorage.getItem('account-board:theme');
    document.documentElement.dataset.theme =
      t === 'light' || t === 'dark' ? t
        : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  } catch (e) {
    document.documentElement.dataset.theme = 'light';
  }
</script>
<!-- Critical styles: layout skeleton only, so the page never flashes unstyled. -->
<style>
  :root { --w: 1080px; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fff;
    color: #1a1a1a;
  }
  :root[data-theme="dark"] body { background: #0e0e0f; color: #f4f4f5; }
  .shell { max-width: var(--w); margin: 0 auto; padding: 28px 20px 56px; }
  /* grid.js appends a canvas sized in device pixels. Unstyled that is an inline
     box two thousand pixels tall at the top of the body, so this one rule is
     not decoration — it is what stops the page folding if styles.css is slow. */
  .grid-bg { position: fixed; inset: 0; z-index: -2; width: 100%; height: 100%; pointer-events: none; }
  [hidden] { display: none !important; }
</style>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="shell">

  <div class="topbar">
    <div class="topbar-left">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">ACCOUNT BOARD</span>
      </div>
      <nav class="nav"><a href="./index.html">Board</a></nav>
    </div>
    <div class="topbar-right">
      <span class="who" id="who" hidden></span>
      <div class="conn" id="conn" data-state="connecting" title="Connection to the board">
        <span class="dot" aria-hidden="true"></span>
        <span class="conn-label" id="conn-label">connecting…</span>
      </div>
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch theme">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.2 14.6A8.5 8.5 0 0 1 9.4 3.8a8.5 8.5 0 1 0 10.8 10.8Z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4.1"/>
          <path d="M12 2.7v2.1M12 19.2v2.1M4.4 4.4l1.5 1.5M18.1 18.1l1.5 1.5M2.7 12h2.1M19.2 12h2.1M4.4 19.6l1.5-1.5M18.1 5.9l1.5-1.5"/>
        </svg>
      </button>
    </div>
  </div>

  <header class="head">
    <h1>Recent activity</h1>
    <p class="sub" id="sub">Every claim, release and force release, newest
      first. The log is append-only, so nothing here can be edited or taken
      back.</p>
  </header>

  <div class="banner" id="banner" hidden role="alert">
    <strong id="banner-title">Setup incomplete</strong>
    <p id="banner-body"></p>
  </div>

  <!-- Shown instead of the log to anyone who is not the owner. A curtain, not
       a lock — see the README. -->
  <p class="locked" id="locked" hidden>
    This page is for the board owner. Everything you need is on
    <a href="./index.html">the board</a>.
  </p>

  <!-- Narrowing the log by account and by date. Part of the owner's page, so
       it is hidden until activity.js has been told who is reading — same gate
       as the log itself, and it never appears on the locked view. -->
  <form class="filters" id="filters" hidden aria-label="Filter the activity log">
    <div class="filter-field">
      <label class="label" for="filter-account">Account</label>
      <select id="filter-account">
        <option value="">All accounts</option>
      </select>
    </div>

    <div class="filter-field filter-field-date">
      <label class="label" for="filter-from">From</label>
      <input id="filter-from" type="date">
    </div>

    <div class="filter-field filter-field-date">
      <label class="label" for="filter-to">To</label>
      <input id="filter-to" type="date">
    </div>

    <!-- The three ranges anyone actually asks for, as one click each. They only
         write the two date fields, so what they did stays visible and stays
         editable. -->
    <div class="filter-presets" role="group" aria-label="Quick date ranges">
      <button class="chip" id="range-today" type="button" data-range="today" aria-pressed="false">Today</button>
      <button class="chip" id="range-7" type="button" data-range="7" aria-pressed="false">7 days</button>
      <button class="chip" id="range-30" type="button" data-range="30" aria-pressed="false">30 days</button>
    </div>

    <button class="btn btn-quiet btn-sm filter-clear" id="filter-clear" type="button" hidden>Clear</button>
  </form>

  <!-- How much of the window survived the filters. Shown only while something
       is filtering, because "showing 200 of 200" is noise. -->
  <p class="filter-count" id="filter-count" hidden role="status"></p>

  <ul class="log" id="log-list" aria-live="polite">
    <li class="log-empty">Loading…</li>
  </ul>

  <p class="log-foot" id="log-foot" hidden></p>

</main>

<script type="module" src="activity.js"></script>
</body>
</html>
